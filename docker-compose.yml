services:
  # O'z Telegram Bot API serverimiz — 2 GB gacha video qabul qilish uchun (oddiy API: 20 MB)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - tg-files:/var/lib/telegram-bot-api

  bot:
    build: .
    env_file: .env
    environment:
      TELEGRAM_API_URL: http://telegram-bot-api:8081
    depends_on: [telegram-bot-api]
    restart: unless-stopped
    volumes:
      - tg-files:/var/lib/telegram-bot-api   # bot API yuklagan fayllarni to'g'ridan-to'g'ri o'qiydi
      - models:/root/.cache/huggingface
      - ./data:/data

volumes:
  tg-files:
  models:
